<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - 个人 AI 管家</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-deep: #020a14;
      --bg-panel: #061520;
      --bg-card: #0a1e2e;
      --bg-input: #081828;
      --cyan: #00e5ff;
      --cyan-dim: #00a0b4;
      --cyan-glow: rgba(0,229,255,0.15);
      --cyan-glow-strong: rgba(0,229,255,0.35);
      --orange: #ff6d00;
      --orange-dim: #b34d00;
      --orange-glow: rgba(255,109,0,0.15);
      --red: #ff1744;
      --green: #00e676;
      --text: #c8dce8;
      --text-dim: #5a7a8a;
      --text-bright: #e8f4fc;
      --border: #0e2a3a;
      --border-active: #1a4a5a;
      --font-display: 'Orbitron', monospace;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      font-size: 15px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .app {
      display: flex;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* === SIDEBAR === */
    .sidebar {
      width: 280px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .sidebar::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 1px;
      height: 100%;
      background: linear-gradient(180deg, transparent, var(--cyan-dim), transparent);
      opacity: 0.4;
    }

    .sidebar-header {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .sidebar-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20px;
      right: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan-dim), transparent);
      opacity: 0.3;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 900;
      color: var(--cyan);
      letter-spacing: 6px;
      text-shadow: 0 0 20px var(--cyan-glow-strong), 0 0 40px var(--cyan-glow);
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { text-shadow: 0 0 20px var(--cyan-glow-strong), 0 0 40px var(--cyan-glow); }
      50% { text-shadow: 0 0 30px var(--cyan-glow-strong), 0 0 60px var(--cyan-glow), 0 0 80px rgba(0,229,255,0.08); }
    }

    .logo-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 3px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .new-chat-btn {
      margin: 16px;
      padding: 12px 16px;
      background: transparent;
      border: 1px solid var(--border-active);
      border-radius: 4px;
      color: var(--cyan);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .new-chat-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, var(--cyan-glow), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }

    .new-chat-btn:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-glow), inset 0 0 15px var(--cyan-glow);
    }

    .new-chat-btn:hover::before {
      transform: translateX(100%);
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .conv-item {
      padding: 12px 16px;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      transition: all 0.2s;
      border-left: 2px solid transparent;
      font-size: 13px;
    }

    .conv-item:hover {
      background: var(--bg-card);
      border-left-color: var(--cyan-dim);
    }

    .conv-item.active {
      background: var(--bg-card);
      border-left-color: var(--cyan);
      box-shadow: inset 3px 0 10px var(--cyan-glow);
    }

    .conv-item .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      font-weight: 500;
    }

    .conv-item .del {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
      transition: color 0.2s;
    }

    .conv-item:hover .del { opacity: 0.6; }
    .conv-item .del:hover { color: var(--red); opacity: 1; }

    .status-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .datetime-bar {
      padding: 8px 16px 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--cyan-dim);
      letter-spacing: 1px;
      line-height: 1.6;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* === MAIN AREA === */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }

    .main-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .main-header .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-active), transparent);
    }

    /* === CONTENT AREA (messages + tool panel) === */
    .content-area {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* === MESSAGES === */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      min-width: 0;
    }

    /* 扫描光效：文字生成时的视觉提示 */
    @keyframes scanLine {
      0% { top: -2px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: calc(100% + 2px); opacity: 0; }
    }

    .msg.assistant.streaming::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--cyan-glow-strong), var(--cyan), transparent);
      box-shadow: 0 0 12px var(--cyan), 0 0 30px var(--cyan-glow);
      animation: scanLine 2.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }

    .msg.assistant.streaming {
      position: relative;
      overflow: hidden;
    }

    .msg.assistant.streaming::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, var(--cyan-glow) 50%, transparent 100%);
      opacity: 0.06;
      animation: scanLine 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    .msg {
      margin-bottom: 24px;
      animation: fadeSlideIn 0.3s ease-out;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-header {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .msg-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .msg.user .msg-header { color: var(--orange); }
    .msg.assistant .msg-header { color: var(--cyan); }

    .msg-body {
      padding: 14px 18px;
      border-radius: 4px;
      line-height: 1.7;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }

    .msg.user .msg-body {
      background: linear-gradient(135deg, rgba(255,109,0,0.08), rgba(255,109,0,0.03));
      border: 1px solid rgba(255,109,0,0.15);
      border-left: 3px solid var(--orange-dim);
    }

    .msg.assistant .msg-body {
      background: linear-gradient(135deg, rgba(0,229,255,0.06), rgba(0,229,255,0.02));
      border: 1px solid rgba(0,229,255,0.1);
      border-left: 3px solid var(--cyan-dim);
    }

    /* === MARKDOWN RENDERING === */
    .msg-body h1, .msg-body h2, .msg-body h3, .msg-body h4 {
      color: var(--text-bright);
      margin: 16px 0 8px;
      font-family: var(--font-body);
    }
    .msg-body h1 { font-size: 20px; }
    .msg-body h2 { font-size: 17px; }
    .msg-body h3 { font-size: 15px; color: var(--cyan); }

    .msg-body p {
      margin: 8px 0;
    }

    .msg-body ul, .msg-body ol {
      margin: 8px 0;
      padding-left: 20px;
    }
    .msg-body li {
      margin: 4px 0;
    }

    .msg-body code {
      background: rgba(0,229,255,0.08);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--cyan);
    }

    .msg-body pre {
      background: var(--bg-deep);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 14px;
      margin: 10px 0;
      overflow-x: auto;
    }
    .msg-body pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
      font-size: 12.5px;
    }

    .msg-body table {
      border-collapse: collapse;
      margin: 10px 0;
      width: 100%;
      font-size: 13px;
    }
    .msg-body th, .msg-body td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
    }
    .msg-body th {
      background: var(--bg-card);
      color: var(--cyan);
      font-weight: 600;
    }

    .msg-body blockquote {
      border-left: 3px solid var(--cyan-dim);
      padding-left: 12px;
      margin: 8px 0;
      color: var(--text-dim);
    }

    .msg-body a {
      color: var(--cyan);
      text-decoration: none;
    }
    .msg-body a:hover {
      text-decoration: underline;
    }

    .msg-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    .msg-body strong {
      color: var(--text-bright);
    }

    /* === TOOL INDICATOR (inline in chat) === */
    .tool-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--cyan-dim);
      margin: 4px 0;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tool-indicator:hover {
      border-color: var(--cyan-dim);
      background: rgba(0,229,255,0.08);
    }

    .tool-indicator.running {
      border-color: var(--cyan-dim);
    }

    .tool-indicator.running .ti-dot {
      width: 6px;
      height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      animation: blink 1s ease-in-out infinite;
    }

    .tool-indicator.done .ti-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
    }

    .tool-indicator .ti-name {
      color: var(--cyan);
    }

    /* === TOOL PANEL (right side) === */
    .tool-panel {
      width: 0;
      overflow: hidden;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      transition: width 0.3s ease;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .tool-panel.open {
      width: 380px;
    }

    .tool-panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--cyan);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .tool-panel-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
      transition: color 0.2s;
    }

    .tool-panel-close:hover { color: var(--red); }

    .tool-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .tool-entry {
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      animation: fadeSlideIn 0.3s ease-out;
    }

    .tool-entry-header {
      padding: 10px 14px;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .tool-entry-header:hover {
      background: rgba(0,229,255,0.06);
    }

    .tool-entry-header .te-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .tool-entry.running .tool-entry-header .te-icon {
      background: var(--cyan-glow);
      color: var(--cyan);
      animation: spin 2s linear infinite;
    }

    .tool-entry.done .tool-entry-header .te-icon {
      background: rgba(0,230,118,0.15);
      color: var(--green);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .tool-entry-header .te-name {
      color: var(--cyan);
      font-weight: 600;
      flex: 1;
    }

    .tool-entry-header .te-status {
      color: var(--text-dim);
      font-size: 10px;
    }

    .tool-entry-header .te-chevron {
      color: var(--text-dim);
      transition: transform 0.2s;
      font-size: 10px;
    }

    .tool-entry.expanded .te-chevron {
      transform: rotate(90deg);
    }

    .tool-entry-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .tool-entry.expanded .tool-entry-body {
      max-height: 800px;
    }

    .tool-entry-content {
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
    }

    .tool-entry-content .label {
      color: var(--cyan-dim);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      margin-top: 8px;
    }

    .tool-entry-content .label:first-child {
      margin-top: 0;
    }

    .tool-entry-content pre {
      background: var(--bg-deep);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 8px 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
      color: var(--text);
    }

    /* === INPUT === */
    .input-area {
      padding: 20px 32px 24px;
      border-top: 1px solid var(--border);
      position: relative;
      flex-shrink: 0;
    }

    .input-area::before {
      content: '';
      position: absolute;
      top: 0;
      left: 32px;
      right: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan-dim), transparent);
      opacity: 0.3;
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .input-row textarea {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px 18px;
      color: var(--text-bright);
      font-family: var(--font-body);
      font-size: 15px;
      resize: none;
      outline: none;
      transition: all 0.3s;
      min-height: 48px;
      max-height: 200px;
      line-height: 1.5;
    }

    .input-row textarea:focus {
      border-color: var(--cyan-dim);
      box-shadow: 0 0 15px var(--cyan-glow), inset 0 0 10px rgba(0,229,255,0.05);
    }

    .input-row textarea::placeholder {
      color: var(--text-dim);
      font-style: italic;
    }

    .send-btn {
      width: 48px;
      height: 48px;
      background: transparent;
      border: 1px solid var(--border-active);
      border-radius: 4px;
      color: var(--cyan);
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      border-color: var(--cyan);
      background: var(--cyan-glow);
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .send-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .input-hint {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    /* === WELCOME === */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .welcome-logo {
      font-family: var(--font-display);
      font-size: 72px;
      font-weight: 900;
      color: var(--cyan);
      letter-spacing: 12px;
      text-shadow: 0 0 40px var(--cyan-glow-strong), 0 0 80px var(--cyan-glow);
      animation: pulse-glow 3s ease-in-out infinite;
      margin-bottom: 8px;
    }

    .welcome-sub {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    .welcome-hint {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1px;
      opacity: 0.6;
    }

    .welcome::before, .welcome::after {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border-color: var(--cyan-dim);
      border-style: solid;
      opacity: 0.2;
    }
    .welcome::before {
      top: 15%;
      left: 15%;
      border-width: 1px 0 0 1px;
    }
    .welcome::after {
      bottom: 15%;
      right: 15%;
      border-width: 0 1px 1px 0;
    }

    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan-glow), transparent);
      opacity: 0.4;
      animation: scanline 4s linear infinite;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes scanline {
      0% { top: -2px; }
      100% { top: 100vh; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--cyan-dim); }

    .msg.error .msg-body {
      background: rgba(255,23,68,0.08);
      border: 1px solid rgba(255,23,68,0.2);
      border-left: 3px solid var(--red);
      color: var(--red);
    }

    .loading-dots {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }
    .loading-dots span {
      width: 6px;
      height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    /* === MEMORY PANEL === */
    .memory-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: none;
    }

    .memory-panel-header {
      font-family: var(--font-display);
      font-size: 18px;
      color: var(--cyan);
      letter-spacing: 3px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .memory-panel-header .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-active), transparent);
    }

    .memory-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .memory-stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 16px;
      min-width: 120px;
    }

    .memory-stat .ms-count {
      font-family: var(--font-display);
      font-size: 24px;
      color: var(--cyan);
    }

    .memory-stat .ms-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .memory-section {
      margin-bottom: 24px;
    }

    .memory-section-title {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--cyan-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .memory-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .memory-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .memory-card:hover {
      border-color: var(--border-active);
    }

    .memory-card .mc-content {
      flex: 1;
      font-size: 13px;
      line-height: 1.6;
    }

    .memory-card .mc-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .memory-card .mc-delete {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .memory-card .mc-delete:hover {
      opacity: 0.6;
    }

    .memory-card .mc-delete:hover {
      color: var(--red);
      opacity: 1;
    }

    .memory-type-fact { border-left: 3px solid #4fc3f7; }
    .memory-type-preference { border-left: 3px solid #ff9800; }
    .memory-type-task { border-left: 3px solid #f44336; }
    .memory-type-summary { border-left: 3px solid #66bb6a; }

    .memory-empty {
      text-align: center;
      padding: 48px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .memory-filters {
      display: flex;
      gap: 8px;
      padding: 0 0 16px;
    }
    .mf-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
    }
    .mf-btn.active, .mf-btn:hover {
      border-color: var(--cyan-dim);
      color: var(--cyan);
      background: var(--cyan-glow);
    }

    .mc-tier {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
    }
    .mc-tier-long { background: rgba(0,230,118,0.15); color: #00e676; }
    .mc-tier-short { background: rgba(255,109,0,0.15); color: #ff6d00; }

    .mc-hits {
      font-size: 11px;
      color: var(--cyan-dim);
      font-family: var(--font-mono);
      margin-left: 6px;
    }

    .mc-date {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin-left: auto;
    }

    .mc-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .memory-card:hover .mc-actions { opacity: 1; }

    .mc-trace-btn {
      background: transparent;
      border: 1px solid var(--cyan-dim);
      color: var(--cyan);
      padding: 2px 8px;
      font-size: 10px;
      font-family: var(--font-mono);
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
    }
    .mc-trace-btn:hover {
      background: var(--cyan-glow);
    }

    .mc-consolidate-btn {
      background: transparent;
      border: 1px solid var(--orange-dim);
      color: var(--orange);
      padding: 3px 12px;
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      border-radius: 3px;
      margin-left: auto;
      transition: all 0.2s;
    }
    .mc-consolidate-btn:hover {
      background: var(--orange-glow);
    }

    .mc-source-panel {
      margin-top: 12px;
      padding: 12px;
      background: var(--bg-deep);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
    }
    .mc-src-conv {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .mc-src-conv:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .mc-src-title {
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 11px;
      margin-bottom: 6px;
    }
    .mc-src-msg {
      color: var(--text-dim);
      font-size: 11px;
      line-height: 1.5;
      padding: 2px 0;
    }
    .mc-src-role {
      color: var(--text);
      font-weight: 600;
    }

    /* === MEMORY TOAST === */
    .memory-toast {
      position: fixed;
      bottom: 100px;
      right: 32px;
      background: var(--bg-card);
      border: 1px solid var(--cyan-dim);
      border-radius: 4px;
      padding: 12px 20px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 50;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 0 20px var(--cyan-glow);
    }

    .memory-toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .memory-toast .mt-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .memory-toast .mt-items {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .memory-toast .mt-item {
      padding: 2px 0;
    }

    .memory-toast .mt-item::before {
      content: '+ ';
      color: var(--green);
    }

    /* === SIDEBAR NAV BUTTONS === */
    .sidebar-nav {
      display: flex;
      gap: 8px;
      margin: 0 16px 8px;
    }

    .nav-btn {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      border-color: var(--border-active);
      color: var(--text);
    }

    .nav-btn.active {
      border-color: var(--cyan-dim);
      color: var(--cyan);
      background: var(--cyan-glow);
    }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <div class="app">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo">JARVIS</div>
        <div class="logo-sub">Personal AI System</div>
      </div>
      <button class="new-chat-btn" onclick="newChat()">+ NEW SESSION</button>
      <div class="sidebar-nav">
        <button class="nav-btn active" id="navChat" onclick="switchView('chat')">CHAT</button>
        <button class="nav-btn" id="navMemory" onclick="switchView('memory')">MEMORY</button>
      </div>
      <div class="conversation-list" id="convList"></div>
      <div class="status-bar">
        <span class="status-dot"></span>
        <span id="statusText">SYSTEM ONLINE</span>
      </div>
      <div class="datetime-bar" id="datetimeBar"></div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="main-header">
        <span>ACTIVE SESSION</span>
        <span class="line"></span>
        <span id="headerConvId">--</span>
      </div>

      <!-- Welcome -->
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-logo">JARVIS</div>
        <div class="welcome-sub">Just A Rather Very Intelligent System</div>
        <div class="welcome-hint">发送消息开始对话</div>
      </div>

      <!-- Content Area: messages + tool panel -->
      <div class="content-area" id="contentArea" style="display:none">
        <div class="messages" id="messages"></div>
        <div class="tool-panel" id="toolPanel">
          <div class="tool-panel-header">
            <span>TOOL EXEC LOG</span>
            <button class="tool-panel-close" onclick="closeToolPanel()">&times;</button>
          </div>
          <div class="tool-panel-body" id="toolPanelBody"></div>
        </div>
      </div>

      <!-- Memory Panel -->
      <div class="memory-panel" id="memoryPanel"></div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-row">
          <textarea id="userInput" placeholder="输入指令..." rows="1" onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
          </button>
        </div>
        <div class="input-hint">ENTER 发送 · SHIFT+ENTER 换行</div>
      </div>
    </div>
  </div>

  <!-- Memory Toast -->
  <div class="memory-toast" id="memoryToast">
    <span class="mt-spinner"></span>
    <span id="memoryToastText">正在整理记忆...</span>
  </div>

  <script>
    // === STATE ===
    let socket = null;
    let currentConvId = null;
    let isStreaming = false;
    let streamContent = '';
    let toolEntries = {};  // id -> { name, args, result, status }

    // === INIT ===
    function init() {
      socket = io();

      socket.on('conversation_created', (data) => {
        currentConvId = data.id;
        document.getElementById('headerConvId').textContent = data.id.slice(0, 8);
        loadConversations();
      });

      socket.on('chat_start', () => {
        isStreaming = true;
        streamContent = '';
        updateSendBtn();
        showChat();
        addAssistantPlaceholder();
      });

      socket.on('chat_token', (data) => {
        streamContent += data.token;
        // 如果流式占位符不存在（被工具调用移除），重新创建
        if (!document.getElementById('streamingMsg')) {
          addAssistantPlaceholder();
        }
        updateStreamingMessage(sanitizeText(streamContent));
      });

      socket.on('tool_call', (data) => {
        // 清除流式输出的"思考"文本（工具调用前的无用前缀）
        removeStreamingPlaceholder();
        streamContent = '';

        toolEntries[data.id] = {
          name: data.name,
          args: data.arguments,
          result: null,
          status: 'running'
        };
        addToolIndicator(data.id, data.name);
        openToolPanel();
        renderToolPanel();
      });

      socket.on('tool_result', (data) => {
        if (toolEntries[data.id]) {
          toolEntries[data.id].result = data.result;
          toolEntries[data.id].status = 'done';
        }
        markToolIndicatorDone(data.id);
        renderToolPanel();
      });

      socket.on('chat_done', (data) => {
        isStreaming = false;
        currentConvId = data.conversationId;
        updateSendBtn();
        loadConversations();
        // 如果流式内容为空（工具调用后无文本回复），移除占位符
        if (!streamContent) {
          removeStreamingPlaceholder();
        } else {
          finalizeStreamMessage();
        }
      });

      socket.on('chat_error', (data) => {
        isStreaming = false;
        updateSendBtn();
        removeStreamingPlaceholder();
        addMessage('error', '错误: ' + data.error);
      });

      socket.on('memory_start', () => {
        showMemoryToast('正在整理记忆...', []);
      });

      socket.on('memory_done', (data) => {
        const items = data.memories || [];
        if (items.length > 0) {
          showMemoryToast('记忆已更新', items);
          // 如果当前在记忆视图，自动刷新
          if (currentView === 'memory') {
            setTimeout(() => loadMemoryPanel(), 500);
          }
        } else {
          hideMemoryToast();
        }
      });

      loadConversations();
    }

    // === CONVERSATIONS ===
    async function loadConversations() {
      try {
        const res = await fetch('/api/conversations');
        const convs = await res.json();
        const list = document.getElementById('convList');
        list.innerHTML = convs.map(c => `
          <div class="conv-item ${c.id === currentConvId ? 'active' : ''}" onclick="selectConv('${c.id}')">
            <span class="title">${escHtml(c.title)}</span>
            <button class="del" onclick="event.stopPropagation();deleteConv('${c.id}')">&times;</button>
          </div>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function selectConv(id) {
      currentConvId = id;
      document.getElementById('headerConvId').textContent = id.slice(0, 8);
      loadConversations();
      await loadConversation(id);
    }

    async function loadConversation(id) {
      try {
        const res = await fetch(`/api/conversations/${id}`);
        const data = await res.json();
        if (!data.messages) return;

        showChat();
        const container = document.getElementById('messages');
        container.innerHTML = '';

        // 收集工具调用信息用于面板展示
        const toolCallMap = {}; // tool_call_id -> { name, args }
        const toolResultMap = {}; // tool_call_id -> result

        for (const m of data.messages) {
          if (m.role === 'assistant' && m.tool_calls) {
            try {
              const calls = JSON.parse(m.tool_calls);
              calls.forEach(tc => {
                toolCallMap[tc.id] = { name: tc.function.name, args: tc.function.arguments };
              });
            } catch {}
          }
          if (m.role === 'tool' && m.tool_call_id) {
            toolResultMap[m.tool_call_id] = m.content || '';
          }
        }

        // 构建工具面板数据
        toolEntries = {};
        for (const [id, tc] of Object.entries(toolCallMap)) {
          toolEntries[id] = {
            name: tc.name,
            args: tc.args,
            result: toolResultMap[id] || null,
            status: toolResultMap[id] ? 'done' : 'running'
          };
        }

        // 渲染消息
        for (const m of data.messages) {
          if (m.role === 'system') continue;
          if (m.role === 'tool') continue; // 工具结果在面板中显示

          // 有 tool_calls 的助手消息：只显示工具指示器，不显示 content
          if (m.role === 'assistant' && m.tool_calls) {
            try {
              const calls = JSON.parse(m.tool_calls);
              calls.forEach(tc => {
                addToolIndicator(tc.id, tc.function.name, true);
              });
            } catch {}
            continue; // 跳过 content，不添加普通气泡
          }

          addMessage(m.role, m.content || '');
        }

        // 如果有工具调用历史，打开面板
        if (Object.keys(toolEntries).length > 0) {
          openToolPanel();
          renderToolPanel();
        }
      } catch (e) { console.error(e); }
    }

    async function deleteConv(id) {
      await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
      if (currentConvId === id) {
        currentConvId = null;
        showWelcome();
      }
      loadConversations();
    }

    function newChat() {
      currentConvId = null;
      toolEntries = {};
      switchView('chat');
      showWelcome();
      closeToolPanel();
      loadConversations();
    }

    // === UI ===
    function showChat(clearMessages) {
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('contentArea').style.display = 'flex';
      if (clearMessages) {
        document.getElementById('messages').innerHTML = '';
      }
    }

    function showWelcome() {
      document.getElementById('welcomeScreen').style.display = 'flex';
      document.getElementById('contentArea').style.display = 'none';
      document.getElementById('headerConvId').textContent = '--';
    }

    // === VIEW SWITCHING ===
    let currentView = 'chat';

    function switchView(view) {
      currentView = view;
      document.getElementById('navChat').classList.toggle('active', view === 'chat');
      document.getElementById('navMemory').classList.toggle('active', view === 'memory');

      const welcome = document.getElementById('welcomeScreen');
      const content = document.getElementById('contentArea');
      const memory = document.getElementById('memoryPanel');
      const input = document.querySelector('.input-area');

      if (view === 'memory') {
        welcome.style.display = 'none';
        content.style.display = 'none';
        memory.style.display = 'block';
        input.style.display = 'none';
        loadMemoryPanel();
      } else {
        memory.style.display = 'none';
        input.style.display = 'block';
        if (currentConvId) {
          content.style.display = 'flex';
        } else {
          welcome.style.display = 'flex';
        }
      }
    }

    // === MEMORY PANEL ===
    const MEMORY_TYPE_LABELS = {
      fact: '事实',
      preference: '偏好',
      task: '任务',
      summary: '摘要'
    };

    const MEMORY_TYPE_ICONS = {
      fact: '📋',
      preference: '⭐',
      task: '📌',
      summary: '📝'
    };

    let memoryTierFilter = 'all';

    function setMemoryFilter(tier) {
      memoryTierFilter = tier;
      loadMemoryPanel();
    }

    async function triggerConsolidation() {
      try {
        const res = await fetch('/api/memory/consolidate', { method: 'POST' });
        const data = await res.json();
        showToast(`已整理 ${data.consolidated} 条记忆`);
        loadMemoryPanel();
      } catch (e) {
        showToast('整理失败');
      }
    }

    async function toggleMemorySource(id, btn) {
      const card = btn.closest('.memory-card');
      const existing = card.querySelector('.mc-source-panel');
      if (existing) {
        existing.remove();
        return;
      }
      try {
        const res = await fetch(`/api/memory/${id}/chain`);
        const chain = await res.json();
        if (!chain.sources || chain.sources.length === 0) {
          showToast('无源头信息');
          return;
        }
        const srcHtml = chain.sources.map(s => {
          const msgs = (s.messages || []).map(m =>
            `<div class="mc-src-msg"><span class="mc-src-role">${m.role}:</span> ${escHtml((m.content || '').slice(0, 150))}</div>`
          ).join('');
          return `<div class="mc-src-conv">
            <div class="mc-src-title">${escHtml(s.conversation_title || '未知对话')}</div>
            ${msgs}
          </div>`;
        }).join('');
        const div = document.createElement('div');
        div.className = 'mc-source-panel';
        div.innerHTML = srcHtml;
        card.appendChild(div);
      } catch (e) {
        showToast('溯源失败');
      }
    }

    async function loadMemoryPanel() {
      const panel = document.getElementById('memoryPanel');
      try {
        const url = memoryTierFilter === 'all' ? '/api/memory' : `/api/memory?tier=${memoryTierFilter}`;
        const res = await fetch(url);
        const allMemories = await res.json();
        const memories = allMemories.filter(m => m.content && m.content.trim());

        if (memories.length === 0) {
          panel.innerHTML = `
            <div class="memory-panel-header">MEMORY BANK <span class="line"></span>
              <button class="mc-consolidate-btn" onclick="triggerConsolidation()" title="整理记忆">整理</button>
            </div>
            <div class="memory-filters">
              <button class="mf-btn ${memoryTierFilter === 'all' ? 'active' : ''}" onclick="setMemoryFilter('all')">全部</button>
              <button class="mf-btn ${memoryTierFilter === 'short' ? 'active' : ''}" onclick="setMemoryFilter('short')">短期</button>
              <button class="mf-btn ${memoryTierFilter === 'long' ? 'active' : ''}" onclick="setMemoryFilter('long')">长期</button>
            </div>
            <div class="memory-empty">暂无记忆数据。与 JARVIS 对话后会自动整理生成。</div>
          `;
          return;
        }

        // 按类型分组
        const grouped = { fact: [], preference: [], task: [], summary: [] };
        memories.forEach(m => {
          if (grouped[m.type]) grouped[m.type].push(m);
        });

        // 统计
        const statsHtml = Object.entries(grouped)
          .filter(([, items]) => items.length > 0)
          .map(([type, items]) => `
            <div class="memory-stat">
              <div class="ms-count">${items.length}</div>
              <div class="ms-label">${MEMORY_TYPE_ICONS[type]} ${MEMORY_TYPE_LABELS[type]}</div>
            </div>
          `).join('');

        // 各类型卡片
        const sectionsHtml = Object.entries(grouped)
          .filter(([, items]) => items.length > 0)
          .map(([type, items]) => {
            const cards = items.map(m => {
              const tierBadge = m.tier === 'long'
                ? '<span class="mc-tier mc-tier-long">LONG</span>'
                : '<span class="mc-tier mc-tier-short">SHORT</span>';
              const hitBadge = m.hit_count > 0
                ? `<span class="mc-hits" title="引用次数">x${m.hit_count}</span>`
                : '';
              return `
                <div class="memory-card memory-type-${m.type}">
                  <div class="mc-content">${escHtml(m.content)}</div>
                  <div class="mc-meta">
                    ${tierBadge} ${hitBadge}
                    <span class="mc-date">${formatDate(m.created_at)}</span>
                  </div>
                  <div class="mc-actions">
                    <button class="mc-trace-btn" onclick="toggleMemorySource('${m.id}', this)" title="溯源">溯源</button>
                    <button class="mc-delete" onclick="deleteMemoryCard('${m.id}')" title="删除">&times;</button>
                  </div>
                </div>
              `;
            }).join('');
            return `
              <div class="memory-section">
                <div class="memory-section-title">${MEMORY_TYPE_ICONS[type]} ${MEMORY_TYPE_LABELS[type]} (${items.length})</div>
                ${cards}
              </div>
            `;
          }).join('');

        panel.innerHTML = `
          <div class="memory-panel-header">MEMORY BANK <span class="line"></span>
            <button class="mc-consolidate-btn" onclick="triggerConsolidation()" title="整理记忆">整理</button>
          </div>
          <div class="memory-filters">
            <button class="mf-btn ${memoryTierFilter === 'all' ? 'active' : ''}" onclick="setMemoryFilter('all')">全部</button>
            <button class="mf-btn ${memoryTierFilter === 'short' ? 'active' : ''}" onclick="setMemoryFilter('short')">短期</button>
            <button class="mf-btn ${memoryTierFilter === 'long' ? 'active' : ''}" onclick="setMemoryFilter('long')">长期</button>
          </div>
          <div class="memory-stats">${statsHtml}</div>
          ${sectionsHtml}
        `;
      } catch (e) {
        panel.innerHTML = `
          <div class="memory-panel-header">MEMORY BANK <span class="line"></span></div>
          <div class="memory-empty">加载失败: ${e.message}</div>
        `;
      }
    }

    function showToast(msg) {
      const existing = document.querySelector('.memory-toast');
      if (existing) existing.remove();
      const div = document.createElement('div');
      div.className = 'memory-toast show';
      div.innerHTML = `<div class="mt-content">${escHtml(msg)}</div>`;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 3000);
    }

    async function deleteMemoryCard(id) {
      await fetch(`/api/memory/${id}`, { method: 'DELETE' });
      loadMemoryPanel();
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${mm}-${dd} ${hh}:${mi}`;
    }

    // === MEMORY TOAST ===
    let toastTimer = null;

    function showMemoryToast(text, items) {
      const toast = document.getElementById('memoryToast');
      const textEl = document.getElementById('memoryToastText');
      let html = text;
      if (items.length > 0) {
        html += '<div class="mt-items">';
        items.forEach(m => {
          const label = MEMORY_TYPE_LABELS[m.type] || m.type;
          const short = m.content.length > 40 ? m.content.slice(0, 40) + '...' : m.content;
          html += `<div class="mt-item">[${label}] ${escHtml(short)}</div>`;
        });
        html += '</div>';
      }
      textEl.innerHTML = html;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideMemoryToast, 5000);
    }

    function hideMemoryToast() {
      document.getElementById('memoryToast').classList.remove('show');
    }

    function renderMarkdown(text) {
      if (typeof marked !== 'undefined' && marked.parse) {
        return marked.parse(text, { breaks: true, gfm: true });
      }
      return escHtml(text);
    }

    function sanitizeText(text) {
      if (!text) return '';
      // 移除 Unicode 替换字符（U+FFFD）和控制字符
      return text.replace(/[�\x00-\x08\x0B\x0C\x0E-\x1F]/g, '').trim();
    }

    function addMessage(role, content) {
      const container = document.getElementById('messages');
      const label = role === 'user' ? 'YOU' : role === 'assistant' ? 'JARVIS' : 'SYSTEM';
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      const clean = sanitizeText(content);
      const bodyHtml = role === 'assistant' ? renderMarkdown(clean) : escHtml(clean);
      div.innerHTML = `
        <div class="msg-header">${label}</div>
        <div class="msg-body">${bodyHtml}</div>
      `;
      container.appendChild(div);
      scrollToBottom();
    }

    function addAssistantPlaceholder() {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg assistant streaming';
      div.id = 'streamingMsg';
      div.innerHTML = `
        <div class="msg-header">JARVIS</div>
        <div class="msg-body" id="streamingBody">
          <div class="loading-dots"><span></span><span></span><span></span></div>
        </div>
      `;
      container.appendChild(div);
      scrollToBottom();
      startSmartScroll();
    }

    function updateStreamingMessage(content) {
      const body = document.getElementById('streamingBody');
      if (body) {
        body.innerHTML = renderMarkdown(content);
        // 不再每帧跳到底部，由 tickScroll 平滑滚动
      }
    }

    function removeStreamingPlaceholder() {
      stopSmartScroll();
      const el = document.getElementById('streamingMsg');
      if (el) el.remove();
    }

    function finalizeStreamMessage() {
      stopSmartScroll();
      const el = document.getElementById('streamingMsg');
      if (el) {
        el.classList.remove('streaming');
        el.removeAttribute('id');
        const body = el.querySelector('#streamingBody');
        if (body) body.removeAttribute('id');
      }
      streamContent = '';
    }

    // === TOOL INDICATORS (inline in chat) ===
    function addToolIndicator(id, name, done) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `tool-indicator ${done ? 'done' : 'running'}`;
      div.id = `ti-${id}`;
      div.onclick = () => openToolPanel();
      div.innerHTML = `
        <span class="ti-dot"></span>
        <span class="ti-name">${escHtml(name)}</span>
        <span>${done ? '完成' : '执行中...'}</span>
      `;
      container.appendChild(div);
      scrollToBottom();
    }

    function markToolIndicatorDone(id) {
      const el = document.getElementById(`ti-${id}`);
      if (el) {
        el.className = 'tool-indicator done';
        const spans = el.querySelectorAll('span');
        if (spans[2]) spans[2].textContent = '完成';
      }
    }

    // === TOOL PANEL (right side) ===
    function openToolPanel() {
      document.getElementById('toolPanel').classList.add('open');
    }

    function closeToolPanel() {
      document.getElementById('toolPanel').classList.remove('open');
    }

    function renderToolPanel() {
      const body = document.getElementById('toolPanelBody');
      const entries = Object.entries(toolEntries);

      body.innerHTML = entries.map(([id, entry]) => {
        const statusIcon = entry.status === 'done' ? '✓' : '⚙';
        const statusText = entry.status === 'done' ? '完成' : '执行中...';

        let argsHtml = '';
        try {
          const parsed = JSON.parse(entry.args);
          argsHtml = `<div class="label">参数</div><pre>${escHtml(JSON.stringify(parsed, null, 2))}</pre>`;
        } catch {
          argsHtml = `<div class="label">参数</div><pre>${escHtml(entry.args || '')}</pre>`;
        }

        let resultHtml = '';
        if (entry.result) {
          const cleanResult = sanitizeText(entry.result);
          const shortResult = cleanResult.length > 500 ? cleanResult.slice(0, 500) + '...' : cleanResult;
          resultHtml = `<div class="label">结果</div><pre>${escHtml(shortResult)}</pre>`;
        }

        return `
          <div class="tool-entry ${entry.status}" id="te-${id}">
            <div class="tool-entry-header" onclick="toggleToolEntry('${id}')">
              <span class="te-icon">${statusIcon}</span>
              <span class="te-name">${escHtml(entry.name)}</span>
              <span class="te-status">${statusText}</span>
              <span class="te-chevron">▶</span>
            </div>
            <div class="tool-entry-body">
              <div class="tool-entry-content">
                ${argsHtml}
                ${resultHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 自动展开最新的
      const last = body.querySelector('.tool-entry:last-child');
      if (last) last.classList.add('expanded');
    }

    function toggleToolEntry(id) {
      const el = document.getElementById(`te-${id}`);
      if (el) el.classList.toggle('expanded');
    }

    // ─── 智能滚动：恒速平滑下移，用户操作后停止 ───
    let userHasScrolled = false;
    let scrollRaf = null;
    let isStreamingActive = false;
    let lastScrollTime = 0;
    const SCROLL_SPEED = 40; // 像素/秒，恒定速度

    function scrollToBottom() {
      const container = document.getElementById('messages');
      container.scrollTop = container.scrollHeight;
      userHasScrolled = false;
    }

    function startSmartScroll() {
      userHasScrolled = false;
      isStreamingActive = true;
      lastScrollTime = performance.now();
      const container = document.getElementById('messages');

      container.addEventListener('wheel', onUserScroll, { passive: true });
      container.addEventListener('touchmove', onUserScroll, { passive: true });
      container.addEventListener('scroll', onScrollCheck, { passive: true });

      tickScroll();
    }

    function stopSmartScroll() {
      isStreamingActive = false;
      const container = document.getElementById('messages');
      container.removeEventListener('wheel', onUserScroll);
      container.removeEventListener('touchmove', onUserScroll);
      container.removeEventListener('scroll', onScrollCheck);
      if (scrollRaf) { cancelAnimationFrame(scrollRaf); scrollRaf = null; }
    }

    function onUserScroll(e) {
      if (e.deltaY < 0) userHasScrolled = true;
    }

    function onScrollCheck() {
      const container = document.getElementById('messages');
      const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;
      if (atBottom) userHasScrolled = false;
    }

    function tickScroll(now) {
      if (!isStreamingActive) return;
      if (!userHasScrolled) {
        const container = document.getElementById('messages');
        const gap = container.scrollHeight - container.scrollTop - container.clientHeight;
        if (gap > 4) {
          // 恒速滚动：固定像素/秒，与内容增长无关
          const dt = lastScrollTime ? (now - lastScrollTime) / 1000 : 0;
          const step = Math.min(gap, SCROLL_SPEED * dt);
          container.scrollTop += step;
        }
      }
      lastScrollTime = now;
      scrollRaf = requestAnimationFrame(tickScroll);
    }

    function escHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // === INPUT ===
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const msg = input.value.trim();
      if (!msg || isStreaming) return;

      input.value = '';
      input.style.height = 'auto';

      const isNew = !currentConvId;
      if (isNew) {
        toolEntries = {};
      }
      showChat(isNew);
      addMessage('user', msg);

      socket.emit('chat', {
        conversationId: currentConvId,
        message: msg,
      });
    }

    function updateSendBtn() {
      document.getElementById('sendBtn').disabled = isStreaming;
    }

    function updateDateTime() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const date = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())}`;
      const time = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const days = ['日','一','二','三','四','五','六'];
      document.getElementById('datetimeBar').innerHTML =
        `${date} 星期${days[now.getDay()]}<br>${time}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.getElementById('userInput');
      textarea.addEventListener('input', () => {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        document.getElementById('sendBtn').disabled = !textarea.value.trim() || isStreaming;
      });
      updateDateTime();
      setInterval(updateDateTime, 1000);
      init();
    });
  </script>
</body>
</html>
