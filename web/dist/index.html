<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - 个人 AI 管家</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-deep: #020a14;
      --bg-panel: #061520;
      --bg-card: #0a1e2e;
      --bg-input: #081828;
      --cyan: #00e5ff;
      --cyan-dim: #00a0b4;
      --cyan-glow: rgba(0,229,255,0.15);
      --cyan-glow-strong: rgba(0,229,255,0.35);
      --orange: #ff6d00;
      --orange-dim: #b34d00;
      --orange-glow: rgba(255,109,0,0.15);
      --red: #ff1744;
      --green: #00e676;
      --text: #c8dce8;
      --text-dim: #5a7a8a;
      --text-bright: #e8f4fc;
      --border: #0e2a3a;
      --border-active: #1a4a5a;
      --font-display: 'Orbitron', monospace;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      font-size: 15px;
    }

    /* === GRID BACKGROUND === */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* === LAYOUT === */
    .app {
      display: flex;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* === SIDEBAR === */
    .sidebar {
      width: 280px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .sidebar::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 1px;
      height: 100%;
      background: linear-gradient(180deg, transparent, var(--cyan-dim), transparent);
      opacity: 0.4;
    }

    .sidebar-header {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .sidebar-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20px;
      right: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan-dim), transparent);
      opacity: 0.3;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 900;
      color: var(--cyan);
      letter-spacing: 6px;
      text-shadow: 0 0 20px var(--cyan-glow-strong), 0 0 40px var(--cyan-glow);
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { text-shadow: 0 0 20px var(--cyan-glow-strong), 0 0 40px var(--cyan-glow); }
      50% { text-shadow: 0 0 30px var(--cyan-glow-strong), 0 0 60px var(--cyan-glow), 0 0 80px rgba(0,229,255,0.08); }
    }

    .logo-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 3px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .new-chat-btn {
      margin: 16px;
      padding: 12px 16px;
      background: transparent;
      border: 1px solid var(--border-active);
      border-radius: 4px;
      color: var(--cyan);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .new-chat-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, var(--cyan-glow), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }

    .new-chat-btn:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-glow), inset 0 0 15px var(--cyan-glow);
    }

    .new-chat-btn:hover::before {
      transform: translateX(100%);
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .conv-item {
      padding: 12px 16px;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      transition: all 0.2s;
      border-left: 2px solid transparent;
      font-size: 13px;
    }

    .conv-item:hover {
      background: var(--bg-card);
      border-left-color: var(--cyan-dim);
    }

    .conv-item.active {
      background: var(--bg-card);
      border-left-color: var(--cyan);
      box-shadow: inset 3px 0 10px var(--cyan-glow);
    }

    .conv-item .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      font-weight: 500;
    }

    .conv-item .del {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
      transition: color 0.2s;
    }

    .conv-item:hover .del { opacity: 0.6; }
    .conv-item .del:hover { color: var(--red); opacity: 1; }

    /* === STATUS BAR === */
    .status-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* === MAIN CHAT === */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .main-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .main-header .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-active), transparent);
    }

    /* === MESSAGES === */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      scroll-behavior: smooth;
    }

    .msg {
      margin-bottom: 24px;
      animation: fadeSlideIn 0.3s ease-out;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-header {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .msg-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .msg.user .msg-header { color: var(--orange); }
    .msg.assistant .msg-header { color: var(--cyan); }
    .msg.tool .msg-header { color: var(--text-dim); }

    .msg-body {
      padding: 14px 18px;
      border-radius: 4px;
      line-height: 1.7;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }

    .msg.user .msg-body {
      background: linear-gradient(135deg, rgba(255,109,0,0.08), rgba(255,109,0,0.03));
      border: 1px solid rgba(255,109,0,0.15);
      border-left: 3px solid var(--orange-dim);
    }

    .msg.assistant .msg-body {
      background: linear-gradient(135deg, rgba(0,229,255,0.06), rgba(0,229,255,0.02));
      border: 1px solid rgba(0,229,255,0.1);
      border-left: 3px solid var(--cyan-dim);
    }

    .msg.tool .msg-body {
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      max-height: 200px;
      overflow-y: auto;
    }

    /* === TOOL CALL BOX === */
    .tool-call {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 16px;
      margin: 8px 0;
      font-family: var(--font-mono);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tool-call .tc-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .tool-call.running .tc-icon {
      background: var(--cyan-glow);
      color: var(--cyan);
      animation: spin 2s linear infinite;
    }

    .tool-call.done .tc-icon {
      background: rgba(0,230,118,0.15);
      color: var(--green);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .tool-call .tc-name { color: var(--cyan); font-weight: 600; }
    .tool-call .tc-status { color: var(--text-dim); margin-left: auto; }

    /* === INPUT === */
    .input-area {
      padding: 20px 32px 24px;
      border-top: 1px solid var(--border);
      position: relative;
    }

    .input-area::before {
      content: '';
      position: absolute;
      top: 0;
      left: 32px;
      right: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan-dim), transparent);
      opacity: 0.3;
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .input-row textarea {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px 18px;
      color: var(--text-bright);
      font-family: var(--font-body);
      font-size: 15px;
      resize: none;
      outline: none;
      transition: all 0.3s;
      min-height: 48px;
      max-height: 200px;
      line-height: 1.5;
    }

    .input-row textarea:focus {
      border-color: var(--cyan-dim);
      box-shadow: 0 0 15px var(--cyan-glow), inset 0 0 10px rgba(0,229,255,0.05);
    }

    .input-row textarea::placeholder {
      color: var(--text-dim);
      font-style: italic;
    }

    .send-btn {
      width: 48px;
      height: 48px;
      background: transparent;
      border: 1px solid var(--border-active);
      border-radius: 4px;
      color: var(--cyan);
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      border-color: var(--cyan);
      background: var(--cyan-glow);
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .send-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .input-hint {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    /* === WELCOME === */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .welcome-logo {
      font-family: var(--font-display);
      font-size: 72px;
      font-weight: 900;
      color: var(--cyan);
      letter-spacing: 12px;
      text-shadow: 0 0 40px var(--cyan-glow-strong), 0 0 80px var(--cyan-glow);
      animation: pulse-glow 3s ease-in-out infinite;
      margin-bottom: 8px;
    }

    .welcome-sub {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    .welcome-hint {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1px;
      opacity: 0.6;
    }

    /* Decorative corner brackets */
    .welcome::before, .welcome::after {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border-color: var(--cyan-dim);
      border-style: solid;
      opacity: 0.2;
    }
    .welcome::before {
      top: 15%;
      left: 15%;
      border-width: 1px 0 0 1px;
    }
    .welcome::after {
      bottom: 15%;
      right: 15%;
      border-width: 0 1px 1px 0;
    }

    /* === SCANLINE EFFECT === */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan-glow), transparent);
      opacity: 0.4;
      animation: scanline 4s linear infinite;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes scanline {
      0% { top: -2px; }
      100% { top: 100vh; }
    }

    /* === SCROLLBAR === */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--cyan-dim); }

    /* === ERROR === */
    .msg.error .msg-body {
      background: rgba(255,23,68,0.08);
      border: 1px solid rgba(255,23,68,0.2);
      border-left: 3px solid var(--red);
      color: var(--red);
    }

    /* === LOADING DOTS === */
    .loading-dots {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }
    .loading-dots span {
      width: 6px;
      height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <div class="app">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo">JARVIS</div>
        <div class="logo-sub">Personal AI System</div>
      </div>
      <button class="new-chat-btn" onclick="newChat()">+ NEW SESSION</button>
      <div class="conversation-list" id="convList"></div>
      <div class="status-bar">
        <span class="status-dot"></span>
        <span id="statusText">SYSTEM ONLINE</span>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="main-header">
        <span>ACTIVE SESSION</span>
        <span class="line"></span>
        <span id="headerConvId">--</span>
      </div>

      <!-- Welcome Screen -->
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-logo">JARVIS</div>
        <div class="welcome-sub">Just A Rather Very Intelligent System</div>
        <div class="welcome-hint">发送消息开始对话</div>
      </div>

      <!-- Chat Area (hidden initially) -->
      <div class="messages" id="messages" style="display:none"></div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-row">
          <textarea id="userInput" placeholder="输入指令..." rows="1" onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
          </button>
        </div>
        <div class="input-hint">ENTER 发送 · SHIFT+ENTER 换行</div>
      </div>
    </div>
  </div>

  <script>
    // === STATE ===
    let socket = null;
    let currentConvId = null;
    let isStreaming = false;
    let streamContent = '';

    // === INIT ===
    function init() {
      socket = io();

      socket.on('conversation_created', (data) => {
        currentConvId = data.id;
        document.getElementById('headerConvId').textContent = data.id.slice(0, 8);
        loadConversations();
      });

      socket.on('chat_start', () => {
        isStreaming = true;
        streamContent = '';
        updateSendBtn();
        showChat();
        addAssistantPlaceholder();
      });

      socket.on('chat_token', (data) => {
        streamContent += data.token;
        updateStreamingMessage(streamContent);
      });

      socket.on('tool_call', (data) => {
        addToolCall(data.id, data.name);
      });

      socket.on('tool_result', (data) => {
        markToolDone(data.id);
      });

      socket.on('chat_done', (data) => {
        isStreaming = false;
        currentConvId = data.conversationId;
        updateSendBtn();
        loadConversations();
        // 将流式占位转为正式消息
        finalizeStreamMessage();
      });

      socket.on('chat_error', (data) => {
        isStreaming = false;
        updateSendBtn();
        removeStreamingPlaceholder();
        addMessage('error', '错误: ' + data.error);
      });

      loadConversations();
    }

    // === CONVERSATIONS ===
    async function loadConversations() {
      try {
        const res = await fetch('/api/conversations');
        const convs = await res.json();
        const list = document.getElementById('convList');
        list.innerHTML = convs.map(c => `
          <div class="conv-item ${c.id === currentConvId ? 'active' : ''}" onclick="selectConv('${c.id}')">
            <span class="title">${escHtml(c.title)}</span>
            <button class="del" onclick="event.stopPropagation();deleteConv('${c.id}')">&times;</button>
          </div>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function selectConv(id) {
      currentConvId = id;
      document.getElementById('headerConvId').textContent = id.slice(0, 8);
      loadConversations();
      await loadConversation(id);
    }

    async function loadConversation(id) {
      try {
        const res = await fetch(`/api/conversations/${id}`);
        const data = await res.json();
        if (!data.messages) return;

        showChat();
        const container = document.getElementById('messages');
        container.innerHTML = '';

        // 先收集所有工具调用的 ID，用于后续匹配结果
        const toolCallIds = new Set();
        for (const m of data.messages) {
          if (m.role === 'assistant' && m.tool_calls) {
            try {
              const calls = JSON.parse(m.tool_calls);
              calls.forEach(tc => toolCallIds.add(tc.id));
            } catch {}
          }
        }

        for (const m of data.messages) {
          if (m.role === 'system') continue;

          // 跳过只有 tool_calls 没有 content 的助手消息（避免空泡）
          if (m.role === 'assistant' && m.tool_calls && !m.content) continue;

          // 渲染工具结果为紧凑的工具调用框
          if (m.role === 'tool') {
            const toolName = m.name || '工具';
            const result = m.content || '';
            const shortResult = result.length > 200 ? result.slice(0, 200) + '...' : result;
            addToolResult(toolName, shortResult);
            continue;
          }

          addMessage(m.role, m.content || '');
        }
      } catch (e) { console.error(e); }
    }

    async function deleteConv(id) {
      await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
      if (currentConvId === id) {
        currentConvId = null;
        showWelcome();
      }
      loadConversations();
    }

    function newChat() {
      currentConvId = null;
      showWelcome();
      loadConversations();
    }

    // === UI ===
    function showChat(clearMessages) {
      document.getElementById('welcomeScreen').style.display = 'none';
      const msgDiv = document.getElementById('messages');
      msgDiv.style.display = 'block';
      if (clearMessages) {
        msgDiv.innerHTML = '';
      }
    }

    function showWelcome() {
      document.getElementById('welcomeScreen').style.display = 'flex';
      document.getElementById('messages').style.display = 'none';
      document.getElementById('headerConvId').textContent = '--';
    }

    function addMessage(role, content) {
      const container = document.getElementById('messages');
      const label = role === 'user' ? 'YOU' : role === 'assistant' ? 'JARVIS' : 'SYSTEM';
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = `
        <div class="msg-header">${label}</div>
        <div class="msg-body">${escHtml(content)}</div>
      `;
      container.appendChild(div);
      scrollToBottom();
    }

    function addAssistantPlaceholder() {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.id = 'streamingMsg';
      div.innerHTML = `
        <div class="msg-header">JARVIS</div>
        <div class="msg-body" id="streamingBody">
          <div class="loading-dots"><span></span><span></span><span></span></div>
        </div>
      `;
      container.appendChild(div);
      scrollToBottom();
    }

    function updateStreamingMessage(content) {
      const body = document.getElementById('streamingBody');
      if (body) {
        body.textContent = content;
        scrollToBottom();
      }
    }

    function removeStreamingPlaceholder() {
      const el = document.getElementById('streamingMsg');
      if (el) el.remove();
    }

    function finalizeStreamMessage() {
      // 将流式消息占位转为正式消息
      const el = document.getElementById('streamingMsg');
      if (el) {
        el.removeAttribute('id');
        const body = el.querySelector('#streamingBody');
        if (body) body.removeAttribute('id');
      }
      // 清理工具调用中的旋转动画
      document.querySelectorAll('.tool-call.running').forEach(tc => {
        tc.className = 'tool-call done';
        const status = tc.querySelector('.tc-status');
        if (status) status.textContent = '完成';
        const icon = tc.querySelector('.tc-icon');
        if (icon) icon.textContent = '✓';
      });
      streamContent = '';
    }

    function addToolCall(id, name) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'tool-call running';
      div.id = `tc-${id}`;
      div.innerHTML = `
        <div class="tc-icon">⚙</div>
        <span class="tc-name">${escHtml(name)}</span>
        <span class="tc-status">执行中...</span>
      `;
      container.appendChild(div);
      scrollToBottom();
    }

    function markToolDone(id) {
      const el = document.getElementById(`tc-${id}`);
      if (el) {
        el.className = 'tool-call done';
        el.querySelector('.tc-status').textContent = '完成';
        el.querySelector('.tc-icon').textContent = '✓';
      }
    }

    function addToolResult(name, result) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'tool-call done';
      div.innerHTML = `
        <div class="tc-icon">✓</div>
        <span class="tc-name">${escHtml(name)}</span>
        <span class="tc-status" style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);max-width:500px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(result)}</span>
      `;
      container.appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      const container = document.getElementById('messages');
      container.scrollTop = container.scrollHeight;
    }

    function escHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // === INPUT ===
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const msg = input.value.trim();
      if (!msg || isStreaming) return;

      input.value = '';
      input.style.height = 'auto';

      // 新会话时清空消息区域，避免串到旧对话
      const isNew = !currentConvId;
      showChat(isNew);
      addMessage('user', msg);

      socket.emit('chat', {
        conversationId: currentConvId,
        message: msg,
      });
    }

    function updateSendBtn() {
      document.getElementById('sendBtn').disabled = isStreaming;
    }

    // Auto-resize textarea
    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.getElementById('userInput');
      textarea.addEventListener('input', () => {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        document.getElementById('sendBtn').disabled = !textarea.value.trim() || isStreaming;
      });
      init();
    });
  </script>
</body>
</html>
